[package]
name = "mush"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Local task and checkpoint control loop"
license = "Apache-2.0"
repository = "https://github.com/mdml/mush"

[dependencies]
clap = { version = "4.6.4", features = ["derive", "env"] }
crossterm = "0.29.0"
ratatui = "0.30.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
tempfile = "3.23.0"

[profile.release]
strip = true
lto = true
